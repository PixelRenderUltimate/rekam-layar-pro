name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: rekam-layar-pro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # --- bagian rilis: hanya jalan kalau keystore sudah disimpan di Secrets ---

      - name: Cek keystore
        id: cek
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "ada=ya" >> "$GITHUB_OUTPUT"; else echo "ada=tidak" >> "$GITHUB_OUTPUT"; fi

      - name: Susun ulang keystore
        if: steps.cek.outputs.ada == 'ya'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/rekam-layar.jks"

      - name: Build APK rilis bertanda tangan
        if: steps.cek.outputs.ada == 'ya'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/rekam-layar.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Unggah APK rilis
        if: steps.cek.outputs.ada == 'ya'
        uses: actions/upload-artifact@v4
        with:
          name: rekam-layar-pro-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Bersihkan keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rekam-layar.jks"
